<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <aside class="sidebar">

    <div class="logo">
    <span class="logo-icon">◉</span>
    <span>MISSION<br>CONTROL</span>
    <button class="close-sidebar">×</button>
</div>

    <nav>
        <a href="dashboard.html" class="active">Home</a>
        <a href="telemetry.html">Telemetry</a>
        <a href="logs.html">Logs</a>
        <a href="alerts.html">Alerts</a>
        <a href="settings.html">Settings</a>
    </nav>

    </aside>
    <header class="dashboard-header">
        <button class="menu-button" id="menuButton">☰</button>
        <h1>Mission Telemetry Dashboard</h1>
        <p>Real-Time Mission Monitoring</p>
    </header>

    <main class="dashboard-container">

        <section class="status-card">
            <h2>Mission Status</h2>
            <p id="missionStatus"><span class="status-dot"></span> MISSION ACTIVE</p>
        </section>
    <div class="telemetry-grid">

        <div class="telemetry-card temperature-card">
            <div class="telemetry-icon">🌡️</div>
                <h3>Temperature</h3>
                <p id="temperature">-- °C</p>
            <div class="progress">
                <div class="progress-bar temperature-progress"></div>
        </div>
    </div>

    <div class="telemetry-card battery-card">
        <div class="telemetry-icon">🔋</div>
            <h3>Battery</h3>
            <p id="battery">-- %</p>
            <div class="progress">
                <div class="progress-bar battery-progress"></div>
            </div>
        </div>
    <div class="telemetry-card pressure-card">
        <div class="telemetry-icon">⏱️</div>
            <h3>Pressure</h3>
            <p id="pressure">-- kPa</p>
            <div class="progress">
                <div class="progress-bar pressure-progress"></div>
            </div>
        </div>
    <div class="telemetry-card signal-card">
        <div class="telemetry-icon">📡</div>
            <h3>Signal</h3>
            <p id="signal">-- %</p>
            <div class="progress">
                <div class="progress-bar signal-progress"></div>
            </div>
        </div>
</div>
        <section class="alerts-section">
            <h2>Alerts</h2>
            <p id="alertMessage">No active alerts.</p>
        </section>

    </main>
<script src="dashboard.js"></script>
</body>
</html>
