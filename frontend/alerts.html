<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alerts</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="alerts.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo">
            <span class="logo-icon">◉</span>
            <span>MISSION<br>CONTROL</span>
            <button class="close-sidebar">×</button>
        </div>

        <nav>
            <a href="dashboard.html">Home</a>
            <a href="telemetry.html">Telemetry</a>
            <a href="logs.html">Logs</a>
            <a href="alerts.html" class="active">Alerts</a>
            <a href="settings.html">Settings</a>
        </nav>

    </aside>


    <header class="dashboard-header">

        <button class="menu-button" id="menuButton">☰</button>

        <h1>Mission Alerts</h1>
        <p>Telemetry Alert Monitoring</p>

    </header>


    <main class="alerts-container">

        <section class="alert-summary">

            <div class="summary-card">
                <span>Total Alerts</span>
                <strong id="totalAlerts">0</strong>
            </div>

            <div class="summary-card">
                <span>Active Alerts</span>
                <strong id="activeAlerts">0</strong>
            </div>

            <div class="summary-card">
                <span>System Status</span>
                <strong id="systemStatus">NORMAL</strong>
            </div>

        </section>


        <section class="alerts-panel">

            <h2>Recent Alerts</h2>

            <div id="alertList">

                <div class="alert-item normal-alert">
                    <div>
                        <strong>✓ System Normal</strong>
                        <p>No critical telemetry alerts detected.</p>
                    </div>

                    <span>Monitoring</span>
                </div>

            </div>

        </section>

    </main>


    <script src="alerts.js"></script>

</body>
</html>
