<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mission Register</title>

    <link rel="stylesheet" href="register.css">

</head>


<body>

    <div class="register-container">

        <div class="register-card">

            <div class="register-logo">
                ◉
            </div>

            <h1>CREATE ACCOUNT</h1>

            <p class="register-subtitle">
                Mission Telemetry & Monitoring System
            </p>


            <form id="registerForm">

                <!-- FULL NAME -->

                <div class="input-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <!-- USERNAME -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Create username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                                <line
                                    x1="3"
                                    y1="3"
                                    x2="21"
                                    y2="21"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Show password"
                        >

                            <svg
                                id="confirmEyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                                <line
                                    x1="3"
                                    y1="3"
                                    x2="21"
                                    y2="21"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>


                <!-- REGISTER MESSAGE -->

                <p id="registerMessage"></p>

            </form>


            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="register.js"></script>


    <script>

        function setupPasswordToggle(
            inputId,
            buttonId,
            iconId
        ) {

            const password =
                document.getElementById(inputId);

            const toggle =
                document.getElementById(buttonId);

            const icon =
                document.getElementById(iconId);


            toggle.addEventListener(
                "click",
                function () {

                    if (password.type === "password") {

                        password.type = "text";

                        toggle.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                        icon.innerHTML = `
                            <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />
                        `;

                    } else {

                        password.type = "password";

                        toggle.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                        icon.innerHTML = `
                            <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                            <line
                                x1="3"
                                y1="3"
                                x2="21"
                                y2="21"
                            />
                        `;

                    }

                }
            );

        }


        setupPasswordToggle(
            "password",
            "togglePassword",
            "eyeIcon"
        );


        setupPasswordToggle(
            "confirmPassword",
            "toggleConfirmPassword",
            "confirmEyeIcon"
        );

    </script>

</body>

</html>
