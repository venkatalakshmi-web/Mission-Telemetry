<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgot-password.css">

</head>


<body>

    <div class="forgot-container">

        <div class="forgot-card">

            <h1>RESET PASSWORD</h1>

            <p>
                Enter your username to reset your password.
            </p>


            <form id="forgotForm">


                <!-- USERNAME -->

                <div>

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <!-- NEW PASSWORD -->

                <div>

                    <label for="newPassword">
                        New Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'newPassword',
                                'newEye'
                            )"
                            aria-label="Show password"
                        >

                            <svg
                                id="newEye"
                                width="22"
                                height="22"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <!-- Eye -->

                                <path
                                    d="M2 12s3.5-7 10-7
                                    10 7 10 7-3.5 7-10 7
                                    S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                                <!-- Slash -->

                                <line
                                    x1="3"
                                    y1="3"
                                    x2="21"
                                    y2="21"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div>

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm new password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword(
                                'confirmPassword',
                                'confirmEye'
                            )"
                            aria-label="Show password"
                        >

                            <svg
                                id="confirmEye"
                                width="22"
                                height="22"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <!-- Eye -->

                                <path
                                    d="M2 12s3.5-7 10-7
                                    10 7 10 7-3.5 7-10 7
                                    S2 12 2 12z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                                <!-- Slash -->

                                <line
                                    x1="3"
                                    y1="3"
                                    x2="21"
                                    y2="21"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- RESET BUTTON -->

                <button type="submit">

                    Reset Password

                </button>


                <!-- MESSAGE -->

                <p id="forgotMessage"></p>


            </form>


            <!-- BACK TO LOGIN -->

            <p>

                <a href="login.html">
                    Back to Login
                </a>

            </p>


        </div>

    </div>


    <script>

        function togglePassword(
            passwordId,
            eyeId
        ) {

            const password =
                document.getElementById(passwordId);

            const eye =
                document.getElementById(eyeId);


            if (password.type === "password") {

                password.type = "text";

                eye.innerHTML = `

                    <path
                        d="M2 12s3.5-7 10-7
                        10 7 10 7-3.5 7-10 7
                        S2 12 2 12z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />

                `;

            }

            else {

                password.type = "password";

                eye.innerHTML = `

                    <path
                        d="M2 12s3.5-7 10-7
                        10 7 10 7-3.5 7-10 7
                        S2 12 2 12z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    />

                    <line
                        x1="3"
                        y1="3"
                        x2="21"
                        y2="21"
                    />

                `;

            }

        }

    </script>
<script src="forgot-password.js"></script>

</body>

</html>
